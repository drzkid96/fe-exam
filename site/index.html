<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FE Civil Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Fehr & Peers palette. Layout idea: slate rail, white work surface on a gray ground,
     emerald as the single accent, orange reserved for wrong answers. Single light theme by choice. */
  --slate:#00242E; --emerald:#00574A; --jade:#1B795A; --lightgreen:#6BD688; --pale:#D9F1D6;
  --cream:#EEEDE8; --band:#F2F2F2; --rule:#E7E8E8; --blue:#568CBB; --orange:#FF6622; --white:#FFFFFF;
  --ink:var(--slate); --muted:rgb(0 36 46 / .68); --ground:var(--band); --surface:var(--white);
  --font:"Albert Sans";
  --r:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--ground)}
button,input,select,textarea{font:inherit;color:inherit}
svg text{font-family:var(--font)}
code{font-family:var(--font);background:var(--band);padding:0 .3em;border-radius:3px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;letter-spacing:-.3px;line-height:1.2}
h2{font-size:18px;color:var(--emerald)}
h3{font-size:14px}
p{margin:0}
a{color:var(--emerald)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
.side{background:var(--slate);color:var(--white);display:flex;flex-direction:column;gap:20px;padding:20px 12px;overflow:auto}
.brand{padding:0 10px;display:flex;flex-direction:column}
.brand b{font-size:20px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.brand span{color:var(--lightgreen);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{padding:8px 10px;border-radius:var(--r);color:var(--white);text-decoration:none;font-weight:500;opacity:.8;white-space:nowrap}
.side nav a:hover{opacity:1;background:rgb(255 255 255 / .06)}
.side nav a[aria-current=page]{opacity:1;background:rgb(255 255 255 / .1);box-shadow:inset 3px 0 0 var(--lightgreen)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;gap:12px;align-items:center;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--rule)}
.top form{flex:1;max-width:520px}
.top input{width:100%;padding:8px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--band)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.dot.ok{background:var(--jade)} .dot.busy{background:var(--blue)} .dot.warn{background:var(--orange)}
#view{flex:1;overflow:auto;padding:24px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--jade)}
.sub{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note{background:var(--pale);border-left:3px solid var(--emerald);padding:12px 16px;border-radius:var(--r)}
.empty{color:var(--muted);padding:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--slate);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--emerald);border-color:var(--emerald);color:var(--white)}
.btn.primary:hover{background:var(--jade);border-color:var(--jade)}
.btn.ghost{border-color:var(--rule);font-weight:500}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--pale);border-color:var(--emerald)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}

.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--emerald);border-radius:4px}
.bar.thin{height:4px}
.bar.jade i{background:var(--lightgreen)}

.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--cream);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;white-space:nowrap}
.t a{font-weight:600;text-decoration:none}
.t a:hover{text-decoration:underline}
.t .n{color:var(--muted);width:28px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rule)}
.chip.plain::before{display:none}
.chip.new::before{background:var(--rule)} .chip.due::before{background:var(--blue)} .chip.missed::before{background:var(--orange)}
.chip.learning::before{background:var(--lightgreen)} .chip.strong::before{background:var(--emerald)}
.chip.sample{background:var(--cream);border-color:var(--cream)} .chip.sample::before{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.tcard:hover{border-color:var(--emerald)}
.tcard .tn{font-size:12px;font-weight:700;color:var(--jade);letter-spacing:.05em}
.tcard strong{font-size:16px;font-weight:600;line-height:1.3}
.tcard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}

details.sub-d{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
details.sub-d>summary{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none}
details.sub-d>summary::-webkit-details-marker{display:none}
details.sub-d>summary .code{font-weight:700;color:var(--jade);width:18px;flex:none}
details.sub-d>summary .nm{flex:1;min-width:0;font-weight:500}
details.sub-d[open]>summary{border-bottom:1px solid var(--rule)}
.sub-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.gsec{border-left:3px solid var(--pale);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.gsec p,.stem p,.sol p{margin:0 0 8px;max-width:70ch} .gsec ul,.stem ul,.sol ul{margin:0 0 8px;padding-left:20px}
.qlist{display:flex;flex-direction:column}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.qrow:last-child{border-bottom:0}
.qrow:hover .qt{text-decoration:underline}
.qrow .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .meta{font-size:13px;color:var(--muted);white-space:nowrap}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{border:1px solid var(--rule);border-radius:var(--r);padding:14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode strong{font-weight:600}.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed=true]{border-color:var(--emerald);background:var(--pale)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select,.filters select,.filters input{padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;font-size:13px;cursor:pointer;background:var(--surface)}
.check input{accent-color:var(--emerald);margin:0}
.check:has(input:checked){border-color:var(--emerald);background:var(--pale)}

.qbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qbar-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;font-weight:600;padding:0 6px}
.clock.low{color:var(--orange)}
.qcard{gap:16px}
.stem{font-size:16px}
.figure svg,.hot svg{max-width:100%;width:520px;height:auto;display:block;border:1px solid var(--rule);border-radius:var(--r);background:var(--white)}
.figure img{max-width:100%}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--slate)}
.opt .key{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--slate);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.multi .key{border-radius:4px}
.opt .otext{flex:1;min-width:0}
.opt.sel{border-color:var(--emerald);background:var(--pale)}
.opt.sel .key{background:var(--emerald);border-color:var(--emerald);color:var(--white)}
.opt.right{border-color:var(--jade);background:var(--pale)}
.opt.right .key{background:var(--jade);border-color:var(--jade);color:var(--white)}
.opt.wrong{border-color:var(--orange);background:rgb(255 102 34 / .08)}
.opt.wrong .key{border-color:var(--orange)}
.opt:disabled{cursor:default;color:var(--ink)}
.mark{flex:none;width:18px;height:18px}
.mark.ok{color:var(--jade)} .mark.no{color:var(--orange)}
.numq{display:flex;flex-direction:column;gap:6px}
.numq label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num-row{display:flex;gap:10px;align-items:center}
.numq input{width:200px;max-width:100%;padding:10px 12px;border:1.5px solid var(--slate);border-radius:var(--r);font-size:16px;font-variant-numeric:tabular-nums;background:var(--surface)}
.numq .unit{font-weight:600}
.hot svg{cursor:crosshair}.hot.locked svg{cursor:default}
.hint{font-size:13px;color:var(--muted)}
.match{display:flex;flex-direction:column;gap:12px}
.pool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:54px;padding:10px;border:1px dashed var(--slate);border-radius:var(--r);background:var(--band)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.target{border:1px solid var(--rule);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:92px;background:var(--surface);cursor:pointer}
.target .tlabel{font-weight:600}
.target .slot{display:flex;gap:6px;flex-wrap:wrap;min-height:36px;border-radius:4px;background:var(--band);padding:4px}
.holding .target,.holding .pool{border-color:var(--emerald)}
.tok{padding:6px 12px;border:1.5px solid var(--slate);border-radius:var(--r);background:var(--surface);font-weight:600;cursor:grab}
.tok.held{background:var(--emerald);border-color:var(--emerald);color:var(--white)}
.tok.right{border-color:var(--jade);background:var(--pale)} .tok.wrong{border-color:var(--orange);background:rgb(255 102 34 / .08)}
.tok:disabled{cursor:default;color:var(--ink)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.oitem{display:flex;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:grab;counter-increment:o}
.oitem::before{content:counter(o);width:22px;font-weight:700;color:var(--jade)}
.oitem .otext{flex:1}
.oitem.right{border-color:var(--jade);background:var(--pale)} .oitem.wrong{border-color:var(--orange);background:rgb(255 102 34 / .08)}
.obtns{display:flex;gap:4px}
.obtns button{width:30px;height:30px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.obtns button:disabled{opacity:.35;cursor:default}
.obtns svg{width:14px;height:14px}
.qfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--slate);color:var(--white)}
.conf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--rule)}
.fb.ok{background:var(--pale);border-color:var(--pale)} .fb.no{background:rgb(255 102 34 / .08);border-color:rgb(255 102 34 / .35)}
.fb-h{display:flex;gap:8px;align-items:center}
.fb-h span{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sol{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.sol h3{margin-bottom:6px;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.sol .figure{margin-top:10px!important}
.gsec>.figure{margin:4px 0!important}
.ask{display:none;border:1px solid var(--rule);border-left:3px solid var(--emerald);border-radius:var(--r);padding:12px 14px;background:var(--white)}
body.has-claude .ask{display:block}
.ask>h3,.ask>summary{font-size:13px;font-weight:600;color:var(--emerald)}
.ask>summary{cursor:pointer}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ask-chips .btn{white-space:normal;text-align:left}
.ask-thread{display:grid;gap:10px;margin-top:10px}
.ask-thread:empty{display:none}
.ask-m{border-left:3px solid var(--pale);padding-left:10px;display:grid;gap:6px}
.ask-m.me{border-left-color:var(--blue)}
.ask-m .who{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ask-form{display:flex;gap:8px;margin-top:10px}
.ask-form input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--white)}
.ask-err{color:var(--orange);font-weight:600}
.ask .hint{margin-top:8px}
.sol.ex{background:var(--band)}
.sol.ex .figure{margin:8px 0!important}
.ideas{display:grid;gap:10px}
.idea{border-left:3px solid var(--pale);padding-left:12px}
.idea>strong{display:block;color:var(--emerald)}
.deep{display:grid;gap:8px}
.method{margin:0;padding-left:22px;display:grid;gap:4px}
.why{border-left:3px solid var(--pale);padding-left:10px;margin:8px 0;display:grid;gap:4px}
.who{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.palette button{height:36px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.palette button.done{background:var(--pale);border-color:var(--pale)}
.palette button.cur{border-color:var(--slate);border-width:2px}
.palette button.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.2;margin:0 .15em}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}.frac>span:last-child{padding:0 .25em}
.sqrt{display:inline-flex;align-items:stretch;vertical-align:middle}
.sqrt svg{width:.7em;height:auto;flex:none}
.sqrt>span{border-top:1px solid currentColor;padding:0 .15em;margin-top:.06em}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--emerald)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input[type=search]{flex:1;min-width:220px}
.res{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.res:last-child{border-bottom:0}
.res strong{font-weight:600}.res:hover strong{text-decoration:underline}
.res .x{font-size:13px;color:var(--muted)}
mark{background:var(--pale);color:inherit;border-radius:2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;justify-content:start}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--band)}
.heat i.l1{background:var(--pale)} .heat i.l2{background:var(--lightgreen)} .heat i.l3{background:var(--jade)} .heat i.l4{background:var(--emerald)}
.heat i.fut{background:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

#modal{position:fixed;inset:0;background:rgb(0 36 46 / .45);display:grid;place-items:center;padding:16px;z-index:10}
#modal .card{max-width:440px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--slate);color:var(--white);padding:10px 16px;border-radius:var(--r);z-index:11;max-width:90vw}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:12px;padding:8px 12px;overflow-x:auto}
  .brand span{display:none}
  .side nav{flex-direction:row}
  .side nav a[aria-current=page]{box-shadow:inset 0 -3px 0 var(--lightgreen)}
  .top{padding:10px 16px}
  #view{padding:16px}
  .status span{display:none}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

#hb{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:-10px 0 28px rgb(0 36 46 / .18);display:flex;flex-direction:column;z-index:40}
#hb[hidden]{display:none}
.hb-head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.hb-head h2{margin:0;font-size:16px;flex:1;color:var(--slate)}
.hb-bar{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap;font-size:13px}
.hb-bar input{padding:6px 8px;border:1px solid var(--rule);border-radius:var(--r);font:inherit;background:var(--band)}
.hb-bar input[type=number]{width:72px} .hb-bar form{display:flex;gap:6px;flex:1;min-width:200px} .hb-bar form input{flex:1;min-width:0}
.hb-body{flex:1;overflow:auto;background:var(--band);padding:12px;display:flex;flex-direction:column;gap:12px}
.hb-res{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);max-height:220px;overflow:auto;flex:none}
.hb-res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.hb-res button:hover,.hb-res button[aria-current=true]{background:var(--pale)} .hb-res b{color:var(--emerald)}
.hb-page{position:relative;background:#fff;box-shadow:0 1px 6px rgb(0 36 46 / .2);flex:none;align-self:center}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>FE Civil</b><span>Study site</span></div>
    <nav aria-label="Sections">

      <a href="#setup" data-to="setup">Setup</a>
    </nav>
  </aside>
  <div class="main">
    <header class="top">
      <form id="gform" role="search"><input id="gsearch" type="search" placeholder="Search questions, topics and guide" aria-label="Search the site" autocomplete="off"></form>

    </header>

  </div>
</div>
<aside id="hb" hidden aria-label="Handbook reader"></aside>
<aside id="calc" hidden aria-label="Calculator"></aside>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
/*CORE-START*/
/* Pure logic: grading, learner model, question selection, search. No DOM, no storage. Tested in tools/test_core.js. */
const Core = (() => {
  const DAY = 86400000;
  const INTERVALS = [0, 1, 3, 7, 14, 30];   // review interval in days for Leitner boxes 0 to 5
  const MIN_N = 5;                           // attempts in a topic before a mastery figure is shown
  const ALPHA = 0.2;                         // weight of the newest attempt in the mastery average
  const FORMATS = ['mcq', 'multi', 'numeric', 'hotspot', 'match', 'order'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const RAD = '<svg viewBox="0 0 10 16" preserveAspectRatio="none" aria-hidden="true"><path d="M0 9.5l2-1 2.6 6.5L9 .6h1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';

  function inline(s) {            // s is already HTML-escaped
    let prev;
    do {
      prev = s;
      s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>')
           .replace(/\\sqrt\{([^{}]*)\}/g, '<span class="sqrt">' + RAD + '<span>$1</span></span>')
           .replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>')
           .replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>');
    } while (s !== prev);
    return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  const richInline = t => inline(esc(t));
  function rich(text) {
    const t = String(text == null ? '' : text).trim();
    if (!t) return '';
    return t.split(/\n{2,}/).map(b => {
      const lines = b.split('\n');
      if (lines.every(l => /^\s*-\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + richInline(l.replace(/^\s*-\s+/, '')) + '</li>').join('') + '</ul>';
      return '<p>' + lines.map(richInline).join('<br>') + '</p>';
    }).join('');
  }
  const plain = t => String(t == null ? '' : t).replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g, 'sqrt($1)').replace(/\^\{([^{}]*)\}/g, '^$1').replace(/_\{([^{}]*)\}/g, '$1').replace(/[*`]/g, '');

  function parseNumber(s) {
    if (typeof s === 'number') return isFinite(s) ? s : null;
    if (s == null) return null;
    const t = String(s).trim().replace(/,/g, '').replace(/\s+/g, '');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return null;
    return Number(t);
  }
  function inPoly(pts, x, y) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function hitRegion(regions, x, y) {
    for (const r of regions || []) {
      if (r.shape === 'rect' && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
      if (r.shape === 'circle' && Math.hypot(x - r.cx, y - r.cy) <= r.r) return r;
      if (r.shape === 'poly' && inPoly(r.points, x, y)) return r;
    }
    return null;
  }
  function numericRange(a) {
    if (a.min != null && a.max != null) return [a.min, a.max];
    const tol = a.tolerance == null ? 0.01 : a.tolerance;
    const d = a.toleranceType === 'abs' ? tol : Math.abs(a.value) * tol;
    return [a.value - d, a.value + d];
  }
  function isAnswered(q, r) {
    switch (q.format) {
      case 'mcq': return r != null && r !== '';
      case 'multi': return Array.isArray(r) && r.length > 0;
      case 'numeric': return parseNumber(r) != null;
      case 'hotspot': return !!r && typeof r.x === 'number';
      case 'match': return !!r && Object.keys(r).length > 0;
      case 'order': return Array.isArray(r) && r.length > 0;
    }
    return false;
  }
  function grade(q, r) {
    if (!isAnswered(q, r)) return {answered: false, correct: false};
    let correct = false;
    switch (q.format) {
      case 'mcq': correct = r === q.answer; break;
      case 'multi': { const a = [...q.answer].sort(), b = [...r].sort(); correct = a.length === b.length && a.every((v, i) => v === b[i]); break; }
      case 'numeric': { const v = parseNumber(r), [lo, hi] = numericRange(q.answer); correct = v >= lo - 1e-12 && v <= hi + 1e-12; break; }
      case 'hotspot': { const hit = hitRegion(q.regions, r.x, r.y); const ans = Array.isArray(q.answer) ? q.answer : [q.answer]; correct = !!hit && ans.includes(hit.id); break; }
      case 'match': correct = q.tokens.every(t => (r[t.id] == null ? null : r[t.id]) === (q.answer[t.id] == null ? null : q.answer[t.id])); break;
      case 'order': correct = r.length === q.answer.length && q.answer.every((v, i) => v === r[i]); break;
    }
    return {answered: true, correct};
  }

  const pad = n => String(n).padStart(2, '0');
  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  const hasReal = questions => questions.some(q => !q.sample);
  function livePool(questions) { const real = hasReal(questions); return questions.filter(q => q.status !== 'draft' && (!real || !q.sample)); }
  const weight = t => (t.min + t.max) / 2;
  function qStatus(qs, now) {
    if (!qs) return 'new';
    if (!qs.last.correct) return 'missed';
    if (qs.dueAt <= now) return 'due';
    return qs.box >= 3 ? 'strong' : 'learning';
  }

  /* Learner model. Everything here is derived from the session log, so it can always be rebuilt.
     Questions that are versions of one problem share a family. Review dates and mastery are kept per family:
     a family is secure only after correct answers on three separate, spaced occasions, so one answer never masters anything. */
  const famOf = q => q.family || q.id;
  const SECURE_BOX = 3;
  function buildModel(exam, questions, sessions, now) {
    const real = hasReal(questions), live = livePool(questions);
    const famById = new Map(questions.map(q => [q.id, famOf(q)]));
    const attempts = [];
    for (const s of sessions || []) for (const a of s.attempts || []) {
      if (real && a.sample) continue;
      attempts.push(Object.assign({}, a, {session: s.id, mode: s.mode, family: a.family || famById.get(a.qid) || a.qid}));
    }
    attempts.sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : 0);
    const mk = extra => Object.assign({n: 0, correct: 0, ms: 0, accuracy: null, avgMs: null}, extra);
    const grp = () => mk({total: 0, versions: 0, seen: 0, due: 0, secure: 0, mastery: null});
    const byTopic = {}, bySub = {}, byFormat = {}, byConf = {0: mk(), 1: mk(), 2: mk(), 3: mk()}, byDay = {}, byF = new Map(), byQ = new Map(), fams = new Map();
    for (const t of exam.topics) { byTopic[t.id] = grp(); for (const st of t.subtopics) bySub[st.id] = grp(); }
    for (const f of FORMATS) byFormat[f] = mk({total: 0});
    for (const q of live) {
      const f = famOf(q);
      if (!fams.has(f)) fams.set(f, {id: f, topic: q.topic, subtopic: q.subtopic, versions: []});
      fams.get(f).versions.push(q);
      if (byFormat[q.format]) byFormat[q.format].total++;
      if (byTopic[q.topic]) byTopic[q.topic].versions++;
      if (bySub[q.subtopic]) bySub[q.subtopic].versions++;
    }
    for (const f of fams.values()) { if (byTopic[f.topic]) byTopic[f.topic].total++; if (bySub[f.subtopic]) bySub[f.subtopic].total++; }
    for (const a of attempts) {
      const bump = o => { if (!o) return; o.n++; if (a.correct) o.correct++; o.ms += a.ms || 0; };
      bump(byTopic[a.topic]); bump(bySub[a.subtopic]); bump(byFormat[a.format]); bump(byConf[a.confidence || 0]);
      const at = Date.parse(a.at), dk = dayKey(at);
      if (!byDay[dk]) byDay[dk] = {n: 0, correct: 0};
      byDay[dk].n++; if (a.correct) byDay[dk].correct++;
      let fs = byF.get(a.family);
      if (!fs) { fs = {n: 0, correct: 0, box: 0, last: null, dueAt: 0, seen: {}}; byF.set(a.family, fs); }
      fs.n++; fs.seen[a.qid] = (fs.seen[a.qid] || 0) + 1;
      const wasDue = fs.box === 0 || at >= fs.dueAt;          // answering again before it is due earns no promotion
      if (!a.correct) { fs.box = 0; fs.dueAt = at; }
      else {
        fs.correct++;
        if (wasDue) { fs.box = a.confidence === 1 ? Math.max(1, fs.box) : Math.min(5, fs.box + 1); fs.dueAt = at + INTERVALS[fs.box] * DAY; }
      }
      fs.last = {correct: !!a.correct, at: a.at, confidence: a.confidence || 0, ms: a.ms || 0, qid: a.qid};
    }
    let due = 0, seen = 0, secure = 0;
    for (const f of fams.values()) {
      const fs = byF.get(f.id); if (!fs) continue;
      const tp = byTopic[f.topic], sb = bySub[f.subtopic];
      seen++; if (tp) tp.seen++; if (sb) sb.seen++;
      if (fs.dueAt <= now) { due++; if (tp) tp.due++; if (sb) sb.due++; }
      if (fs.box >= SECURE_BOX) { secure++; if (tp) tp.secure++; if (sb) sb.secure++; }
      for (const q of f.versions) byQ.set(q.id, fs);
    }
    const fin = o => { o.accuracy = o.n ? o.correct / o.n : null; o.avgMs = o.n ? o.ms / o.n : null; };
    [byTopic, bySub, byFormat, byConf].forEach(g => Object.values(g).forEach(fin));
    Object.values(bySub).forEach(o => { o.mastery = o.total ? o.secure / o.total : null; });
    let wAll = 0, wSum = 0;
    for (const t of exam.topics) {                             // a topic is the average of its subtopics, so every subtopic has to be earned
      const subs = t.subtopics.map(x => bySub[x.id]).filter(o => o.total);
      byTopic[t.id].mastery = subs.length ? subs.reduce((a, o) => a + o.mastery, 0) / subs.length : null;
      if (subs.length) { wAll += weight(t); wSum += weight(t) * byTopic[t.id].mastery; }
    }
    let streak = 0, d = new Date(now);
    if (!byDay[dayKey(d.getTime())]) d.setDate(d.getDate() - 1);
    while (byDay[dayKey(d.getTime())]) { streak++; d.setDate(d.getDate() - 1); }
    const n = attempts.length, correct = attempts.filter(a => a.correct).length, ms = attempts.reduce((x, a) => x + (a.ms || 0), 0);
    return {attempts, byTopic, bySub, byFormat, byConf, byDay, byQ, byF, fams, live, real,
      totals: {n, correct, accuracy: n ? correct / n : null, avgMs: n ? ms / n : null, due, seen, secure, bank: fams.size, versions: live.length,
        weighted: wAll ? wSum / wAll : null, coverage: fams.size ? seen / fams.size : 0, streak}};
  }

  /* Split a question count across topics in proportion to the exam specification (largest remainder). */
  function allocate(exam, count, topicIds) {
    const ts = exam.topics.filter(t => !topicIds || !topicIds.length || topicIds.includes(t.id));
    const sum = ts.reduce((s, t) => s + weight(t), 0), out = {};
    const raw = ts.map(t => weight(t) / sum * count);
    let left = count;
    ts.forEach((t, i) => { out[t.id] = Math.floor(raw[i]); left -= out[t.id]; });
    ts.map((t, i) => [t.id, raw[i] - Math.floor(raw[i])]).sort((a, b) => b[1] - a[1]).slice(0, left).forEach(([id]) => out[id]++);
    return out;
  }
  function shuffle(a, rng) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function nextVersion(versions, fs, rng) {
    if (!fs) return versions[Math.floor((rng || Math.random)() * versions.length)];
    const order = shuffle(versions, rng || Math.random).sort((a, b) => (fs.seen[a.id] || 0) - (fs.seen[b.id] || 0));
    return order.length > 1 && fs.last && order[0].id === fs.last.qid ? order[1] : order[0];
  }
  /* Choose the questions for a session. cfg: {mode, topics, subtopics, formats, count}. */
  function pick(cfg, ctx) {
    const rng = ctx.rng || Math.random, now = ctx.now, st = q => ctx.model.byQ.get(q.id);
    const has = (list, v) => !list || !list.length || list.includes(v);
    let pool = ctx.pool.filter(q => has(cfg.topics, q.topic) && has(cfg.subtopics, q.subtopic) && has(cfg.formats, q.format));
    const count = Math.max(1, cfg.count || 10);
    // one candidate per family: a version not seen yet if there is one, and never the version answered last time
    const groups = new Map();
    for (const q of pool) { const f = famOf(q); if (!groups.has(f)) groups.set(f, []); groups.get(f).push(q); }
    pool = [...groups.values()].map(vs => nextVersion(vs, st(vs[0]), rng));
    if (cfg.mode === 'missed') return pool.filter(q => st(q) && !st(q).last.correct).sort((a, b) => st(a).last.at < st(b).last.at ? -1 : 1).slice(0, count);
    if (cfg.mode === 'flagged') return shuffle(pool.filter(q => ctx.flags[q.id]), rng).slice(0, count);
    if (cfg.mode === 'due') return pool.filter(q => st(q) && st(q).dueAt <= now).sort((a, b) => st(a).dueAt - st(b).dueAt).slice(0, count);
    if (cfg.mode === 'exam') {
      const alloc = allocate(ctx.exam, count, cfg.topics), chosen = [], spare = [];
      for (const t of ctx.exam.topics) {
        if (alloc[t.id] == null) continue;
        const cand = shuffle(pool.filter(q => q.topic === t.id), rng).sort((a, b) => (st(a) ? 1 : 0) - (st(b) ? 1 : 0));
        chosen.push(...cand.slice(0, alloc[t.id])); spare.push(...cand.slice(alloc[t.id]));
      }
      chosen.push(...shuffle(spare, rng).slice(0, Math.max(0, count - chosen.length)));
      const order = Object.fromEntries(ctx.exam.topics.map(t => [t.id, t.n]));
      return chosen.sort((a, b) => order[a.topic] - order[b.topic]);
    }
    const due = pool.filter(q => st(q) && st(q).dueAt <= now).sort((a, b) => st(a).dueAt - st(b).dueAt);
    const rest = pool.filter(q => st(q) && st(q).dueAt > now).sort((a, b) => st(a).box - st(b).box || st(a).dueAt - st(b).dueAt);
    let fresh = pool.filter(q => !st(q));
    if (cfg.mode === 'adaptive') {            // new questions weighted by exam weight and weakness
      const tw = Object.fromEntries(ctx.exam.topics.map(t => { const m = ctx.model.byTopic[t.id].mastery; return [t.id, weight(t) * (1.05 - (m == null ? 0.5 : m))]; }));
      fresh = fresh.map(q => [q, Math.pow(rng(), 1 / (tw[q.topic] || 1))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    } else fresh = shuffle(fresh, rng);
    const takeDue = Math.min(due.length, Math.ceil(count * 0.6));
    const out = due.slice(0, takeDue).concat(fresh, due.slice(takeDue), rest).slice(0, count);
    return shuffle(out, rng);
  }

  const tokenize = s => String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  function buildIndex(exam, questions, guide, reference) {
    const docs = [], tn = Object.fromEntries(exam.topics.map(t => [t.id, t.name]));
    const add = d => { d.tt = tokenize(d.title); d.tb = tokenize(d.body); docs.push(d); };
    for (const t of exam.topics) {
      add({type: 'topic', id: t.id, topic: t.id, title: t.name, body: 'Topic ' + t.n + '. ' + t.subtopics.map(s => s.name).join('. '), href: 'topic-' + t.id});
      for (const s of t.subtopics) add({type: 'topic', id: s.id, topic: t.id, title: s.name, body: t.name + ' subtopic ' + s.code, href: 'topic-' + t.id, open: s.id});
    }
    const indexed = new Set();
    for (const q of livePool(questions)) {
      if (indexed.has(famOf(q))) continue;                     // one search entry per family of versions
      indexed.add(famOf(q));
      const parts = [q.eli5, q.solution].concat((q.options || []).map(o => o.text), (q.tokens || []).map(o => o.text), (q.targets || []).map(o => o.label), (q.items || []).map(o => o.text), q.tags || [], (q.handbook || []).reduce((a, h) => a.concat(h.find || []), []), [tn[q.topic]]);
      add({type: 'question', id: q.id, topic: q.topic, subtopic: q.subtopic, format: q.format, title: plain(q.stem), body: plain(parts.join(' ')), href: 'q-' + q.id});
    }
    for (const tid of Object.keys(guide || {})) for (const s of (guide[tid].sections || []))
      add({type: 'guide', id: s.id, topic: tid, subtopic: s.subtopic, title: s.title, body: plain([s.body].concat((s.formulas || []).map(f => f.name + ' ' + f.expr), s.pitfalls || [], s.example ? [s.example.problem, s.example.steps] : [], [s.deep || ''], s.method || [], (s.ideas || []).map(i => i.title + ' ' + i.text), (s.examples || []).map(e => e.problem), (s.lookup || []).reduce((a, l) => a.concat(l.find), []), (s.read || []).map(r => r.source + ' ' + r.where)).join(' ')), href: 'topic-' + tid, open: s.subtopic || ''});
    for (const s of (reference && reference.sections) || [])
      add({type: 'reference', id: s.id, topic: (s.topics || [])[0] || '', title: s.title, body: plain([s.notes, s.pages].join(' ')), href: 'reference'});

function ctx() { return {pool: S.model.live, model: S.model, exam: S.exam, flags: S.flags, now: Date.now(), rng: Math.random}; }

function startSession(cfg) {
  if (S.session) return modal({title: 'A session is already in progress', body: 'Finish or end it before starting another. Your answers so far are saved.', ok: 'Resume it', onOk: () => go('quiz')});
  const qs = Core.pick(cfg, ctx());
  if (!qs.length) { toast('No questions match that selection yet.'); return; }
  const now = new Date(), slots = {};

    limitMs: cfg.mode === 'exam' ? Math.round(qs.length * targetMs()) : 0, startedAt: now.toISOString(), slots, attempts: []};

function restoreActive() {

}
function sessionDoc(s, status) {

    planned: s.qids.length, contentVersion: S.manifest.version, attempts: s.attempts};
}
function mkAttempt(q, slot) {
  const a = {qid: q.id, family: Core.famOf(q), topic: q.topic, subtopic: q.subtopic, format: q.format, correct: !!slot.result.correct, response: slot.r == null ? null : clone(slot.r),
    ms: Math.round(slot.ms), confidence: slot.conf || 0, at: new Date().toISOString()};

  const id = adhocDoc.id;
  return S.sessions.find(s => s.id === id) || {v: 1, id, mode: 'single', config: {}, startedAt: new Date().toISOString(), endedAt: null, status: 'done', planned: 0, contentVersion: S.manifest.version, attempts: []};
}
function finishSession() {
  const s = S.session; if (!s) return;
  clockStop();
  if (s.attempts.length) { Store.saveSession(sessionDoc(s, 'done')); S.ui.resultId = s.id; }
  S.session = null; persistActive(); recompute();
  go(s.attempts.length ? 'results' : 'practice');
}
function submitExam() {
  const s = S.session; if (!s) return;
  clockStop();
  s.attempts = [];
  for (const id of s.qids) {
    const q = S.qById.get(id), slot = s.slots[id], ans = answered(q, slot);
    slot.result = ans ? {correct: Core.grade(q, slot.r).correct} : {correct: false, skipped: true};
    s.attempts.push(mkAttempt(q, slot));

  finishSession();
}
function cur() {
  if (R.name === 'quiz' && S.session) { const s = S.session, q = S.qById.get(s.qids[s.idx]), slot = s.slots[q.id]; return {kind: 'quiz', q, slot, locked: !s.deferred && !!slot.result}; }

function clockStop() { const c = S.clock; if (c.slot && c.since) c.slot.ms += Date.now() - c.since; S.clock = {slot: null, since: null}; }

/* ---------- Handbook reader ----------
   Shows the student's own copy of the FE Reference Handbook PDF. The file is chosen on this device and kept in this
   browser only (IndexedDB); it is never part of the site, the repository or the study log. content/hbindex.json holds
   only search words and the printed page numbers they appear on. */
const HB = {pdf: null, n: 0, text: null, page: 1, zoom: 1, term: '', res: null, busy: '', note: '', pend: null, tok: 0, tried: false};

function hbPages(term, range) {
  const all = ((S.hbindex || {}).terms || {})[term] || [], m = /(\d+)\D+(\d+)/.exec(range || ''), inr = m ? all.filter(p => p >= +m[1] && p <= +m[2]) : [];
  return (inr.length ? inr : all).slice(0, 3);
}
function hbTerms(terms, range, sep) {
  return terms.map(t => '<strong>' + esc(t) + '</strong> ' + (hbPages(t, range).map(p => '<button type="button" class="pg" data-act="hbGo" data-page="' + p + '" data-term="' + esc(t) + '">p. ' + p + '</button>').join('') ||
    '<button type="button" class="pg" data-act="hbGo" data-term="' + esc(t) + '">search</button>')).join(sep || ' or ');

function hbLink() { const u = (S.settings.handbookUrl || '').trim(); return ' <button type="button" class="btn sm" data-act="hbOpen">Open the handbook</button>' + (/^https:\/\//i.test(u) ? ' <a href="' + esc(u) + '" target="_blank" rel="noopener">Open my handbook</a>' : ''); }
function hbStore(mode, fn) {

    rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => { try { const tx = rq.result.transaction('kv', mode), out = fn(tx.objectStore('kv')); tx.oncomplete = () => res(out && out.result); tx.onerror = tx.onabort = () => rej(tx.error); } catch (e) { rej(e); } }; });
}
const HB_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', 'vendor/'];     // the public CDN copy of PDF.js; a local copy is tried second, for offline testing
function hbLib(n) {
  if (window.pdfjsLib) return Promise.resolve();

}

    else { const t = await hbStore('readonly', st => st.get('text')); if (t) HB.text = t; }

}
function hbFind(term) {
  const t = hbNorm(term); if (!t || !HB.text) return [];
  const out = [];
  HB.text.forEach((txt, i) => { let k = txt.indexOf(t), c = 0; if (k < 0) return; const first = k; while (k >= 0) { c++; k = txt.indexOf(t, k + t.length); }
    out.push({page: i + 1, count: c, pre: txt.slice(Math.max(0, first - 50), first), hit: txt.slice(first, first + t.length), post: txt.slice(first + t.length, first + t.length + 70)}); });

      '<p class="sub">Your copy stays in this browser. It is not uploaded, not added to the site and not saved in your study log, so each browser or device asks for it once.</p><label class="btn primary" for="hb-file">Choose the handbook PDF</label><input id="hb-file" type="file" accept="application/pdf,.pdf" data-change="hbFile" hidden>' +

  }

    const att = mkAttempt(c.q, c.slot);
    if (c.kind === 'quiz') { S.session.attempts.push(att); Store.saveSession(sessionDoc(S.session, 'active')); persistActive(); }
    else { const d = adhocDoc(); d.attempts.push(att); Store.saveSession(d); }
    S.ui.held = null; recompute(); render(); },
  next() { const s = S.session; if (!s) return; clockStop(); S.ui.held = null; if (s.idx < s.qids.length - 1) { s.idx++; persistActive(); render(true); } else if (s.deferred) A.askSubmit(); else finishSession(); },
  prev() { const s = S.session; if (!s || !s.idx) return; clockStop(); s.idx--; persistActive(); render(true); },
  jump(el) { const s = S.session; if (!s) return; clockStop(); s.idx = +el.dataset.i; persistActive(); render(true); },
  mark() { const c = cur(); if (!c) return; c.slot.marked = !c.slot.marked; persistActive(); render(); },
  endSession() { finishSession(); },
  askSubmit() { const s = S.session; if (!s) return; const un = s.qids.filter(id => !answered(S.qById.get(id), s.slots[id])).length;
    modal({title: 'Submit this exam?', body: un ? un + ' unanswered question' + (un > 1 ? 's' : '') + ' will be scored as wrong, as on the real exam.' : 'All questions are answered.', ok: 'Submit exam', cancel: 'Keep working', onOk: submitExam}); },
  soloAgain() { const f = S.model.fams.get(Core.famOf(S.qById.get(S.ui.solo.qid))), q = f ? nextOf(f) : S.qById.get(S.ui.solo.qid); S.ui.solo = {qid: q.id, slot: newSlot(q)}; if (R.arg !== q.id) go('q-' + q.id); else render(); },
  flag(el) { const id = el.dataset.id; if (S.flags[id]) delete S.flags[id]; else S.flags[id] = {at: new Date().toISOString()}; Store.saveFlags(); render(); },
  tab(el) { S.ui.reviewTab = el.dataset.tab; render(); },
  openResult(el) { S.ui.resultId = el.dataset.id; go('results'); },
  retry() { Store.retry(); toast('Trying storage again.'); },
  copyLog() { const text = JSON.stringify({exportedAt: new Date().toISOString(), contentVersion: S.manifest.version, settings: S.settings, flags: S.flags, sessions: S.sessions}, null, 1);
    const fallback = () => modal({title: 'Study log', html: '<p class="sub">Copy the text below.</p><textarea id="log-out" rows="10" style="width:100%" readonly>' + esc(text) + '</textarea>'});
    try { navigator.clipboard.writeText(text).then(() => toast('Study log copied.'), fallback); } catch (e) { fallback(); } },
  modalOk() { const f = modal.onOk; $('#modal').hidden = true; if (f) f(); },
  modalClose() { $('#modal').hidden = true; }
};
const C = {
  setTarget(el) { S.settings.targetMastery = Math.max(40, Math.min(100, +el.value || 80)); Store.saveSettings(); },
  hbFile(el) { const f = el.files && el.files[0]; if (f) f.arrayBuffer().then(b => hbLoad(b, true)); },
  hbPg(el) { if (HB.pdf) { HB.page = Math.max(1, Math.min(HB.n, (+el.value || 1) + hbOff())); hbPaint(); hbRender(); } },
  count(el) { S.ui.practice.count = Math.max(1, Math.min(200, +el.value || 10)); },
  examLen(el) { S.ui.practice.examLen = el.value; },
  pTopic(el) { const p = S.ui.practice; p.topics = el.checked ? p.topics.concat(el.value) : p.topics.filter(x => x !== el.value); },
  pFormat(el) { const p = S.ui.practice; p.formats = el.checked ? p.formats.concat(el.value) : p.formats.filter(x => x !== el.value); },
  sType(el) { S.ui.search.type = el.value; $('#s-res').innerHTML = searchResults(); },
  sTopic(el) { S.ui.search.topic = el.value; $('#s-res').innerHTML = searchResults(); },
  sFormat(el) { S.ui.search.format = el.value; $('#s-res').innerHTML = searchResults(); },
  sStatus(el) { S.ui.search.status = el.value; $('#s-res').innerHTML = searchResults(); },
  setDate(el) { S.settings.examDate = el.value; Store.saveSettings(); },
  setGoal(el) { S.settings.dailyGoal = Math.max(1, Math.min(300, +el.value || 20)); Store.saveSettings(); },
  setLen(el) { S.settings.sessionLength = Math.max(1, Math.min(200, +el.value || 10)); Store.saveSettings(); },
  setHb(el) { const v = el.value.trim(); S.settings.handbookUrl = /^https:\/\//i.test(v) ? v.slice(0, 500) : ''; Store.saveSettings(); }
};
document.addEventListener('click', ev => {
  const res = ev.target.closest && ev.target.closest('a[data-open]'); if (res && res.dataset.open) S.ui.open = res.dataset.open;
  const el = ev.target.closest && ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, ev);
});
document.addEventListener('change', ev => { const el = ev.target, f = el.dataset && C[el.dataset.change]; if (f) f(el); });
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.input;
  if (k === 'calc') { CALC.expr = el.value; return; }
  if (k === 'num') { const c = cur(); if (c && !c.locked) { c.slot.r = el.value; c.slot.touched = true; persistActive(); } }
  else if (k === 'sq') { S.ui.search.q = el.value; $('#gsearch').value = el.value; $('#s-res').innerHTML = searchResults(); }
});
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'gform') { S.ui.search.q = $('#gsearch').value; go('search'); } else if (ev.target.id === 'hbform') hbGoto(0, $('#hb-q').value.trim()); else if (ev.target.id === 'calcform') calcRun(); });
document.addEventListener('keydown', ev => {
  if (!$('#modal').hidden) { if (ev.key === 'Escape') A.modalClose(); return; }
  const tag = (ev.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('ask-in')) { ev.preventDefault(); A.askSend(ev.target); return; }
  if (ev.key === '/' && !typing) { ev.preventDefault(); $('#gsearch').focus(); return; }
  const c = cur(); if (!c) return;
  if (ev.key === 'Enter' && (!typing || ev.target.id === 'num-in') && tag !== 'button' && tag !== 'a') { const b = $('#primary'); if (b) { ev.preventDefault(); b.click(); } return; }
  if (!typing && !c.locked && (c.q.format === 'mcq' || c.q.format === 'multi') && /^[a-h]$/i.test(ev.key) && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { const o = c.q.options[ev.key.toLowerCase().charCodeAt(0) - 97]; if (o) A.opt({dataset: {id: o.id}}); }
});
document.addEventListener('dragstart', ev => {
  const t = ev.target.closest && ev.target.closest('[data-act="tok"]'), o = ev.target.closest && ev.target.closest('[data-drag="order"]');
  if (t) { S.ui.held = t.dataset.id; ev.dataTransfer.setData('text/plain', t.dataset.id); ev.dataTransfer.effectAllowed = 'move'; }
  else if (o) { S.ui.dragI = +o.dataset.i; ev.dataTransfer.setData('text/plain', o.dataset.i); ev.dataTransfer.effectAllowed = 'move'; }
});
document.addEventListener('dragover', ev => { if (ev.target.closest && ev.target.closest('[data-drop],[data-drag="order"],#hb')) ev.preventDefault(); });
document.addEventListener('drop', ev => {
  if (ev.target.closest && ev.target.closest('#hb')) { ev.preventDefault(); const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f && !HB.pdf) f.arrayBuffer().then(b => hbLoad(b, true)); return; }
  const d = ev.target.closest && ev.target.closest('[data-drop]'), o = ev.target.closest && ev.target.closest('[data-drag="order"]');
  if (d && S.ui.held) { ev.preventDefault(); if (d.dataset.drop === 'pool') A.unplace(); else A.place(d); }
  else if (o && S.ui.dragI != null) { ev.preventDefault(); const from = S.ui.dragI; S.ui.dragI = null; moveOrder(from, +o.dataset.i); }
});
document.addEventListener('dragend', () => { S.ui.dragI = null; });
document.addEventListener('visibilitychange', () => { const c = S.clock; if (document.hidden) { if (c.slot && c.since) { c.slot.ms += Date.now() - c.since; c.since = null; } } else if (c.slot && !c.since) c.since = Date.now(); });
window.addEventListener('hashchange', () => { clockStop(); S.ui.held = null; R = parseRoute(); render(true); });
window.addEventListener('pagehide', () => { clockStop(); persistActive(); });
setInterval(tick, 1000);

/* ---------- Boot ---------- */
(async function boot() {
  try { await loadContent(); }
  catch (e) { $('#view').innerHTML = '<div class="wrap"><div class="card"><h2>The site content did not load</h2><p class="sub">' + esc(e.message) + '. Reload the page. If it keeps happening, the content files need republishing.</p></div></div>'; return; }
  recompute(); restoreActive(); R = parseRoute(); render(true);     // usable straight away, before storage answers
  initAsk(); hbRestore(false);
  await Store.init();
  recompute(); if (R.name !== 'quiz' || !S.session) render(); else paintStatus();
})();
</script>
</body>
</html>
